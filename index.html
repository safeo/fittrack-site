<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack — Workout Journal</title>
<style>
  :root { --bg:#0C0B09; --card:#161310; --text:#EDE8E1; --muted:#A79E93; --accent:#C69A5B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:64px 24px 48px; text-align:center; }
  h1 { font-size:40px; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  p.tagline { color:var(--muted); font-size:18px; margin:16px 0 40px; }
  nav { display:flex; flex-direction:column; gap:14px; align-items:center; }
  nav a { display:block; width:100%; max-width:340px; padding:14px 20px; background:var(--card); color:var(--text); text-decoration:none; border:1px solid #2A251F; border-radius:12px; font-size:16px; }
  nav a:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:56px; color:var(--muted); font-size:14px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Fit<span>Track</span></h1>
  <p class="tagline">FitTrack is a workout journal you share with friends.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="delete-account.html">Delete Account</a>
  </nav>
  <footer>
    <p>Questions? Contact us at <a href="mailto:meerve.tunceer@gmail.com">meerve.tunceer@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
